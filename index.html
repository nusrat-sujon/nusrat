<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sujon & Nusrat Love Story</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Hind Siliguri', sans-serif; }
        canvas { display: block; }

        /* স্টার্ট স্ক্রিন */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #1a1a2e, #16213e);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; cursor: pointer; color: white; transition: opacity 1s;
            text-align: center; padding: 20px;
        }
        .title { font-size: 40px; font-family: 'Dancing Script', cursive; color: #ff4081; margin-bottom: 20px; text-shadow: 0 0 10px #ff4081; }
        .hint { font-size: 18px; border: 1px solid rgba(255,255,255,0.5); padding: 10px 25px; border-radius: 50px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1); } 100% { opacity: 0.5; transform: scale(0.95); } }
    </style>
</head>
<body>

<audio id="sultan" src="sultan.mp3"></audio>
<audio id="tujhe" src="tujhe.mp3"></audio>

<div id="overlay" onclick="startStory()">
    <div class="title">Sujon ❤️ Nusrat</div>
    <div class="hint">Click to Start Love Story</div>
</div>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    // --- কনফিগারেশন ---
    const letters = [
        "হে আমার প্রিয়তমা...",
        "আমার হৃদয়ের স্পন্দন, চোখের জ্যোতি,",
        "তোমাকে ছাড়া এ জীবন অর্থহীন,",
        "তুমিই আমার শুরু, তুমিই আমার শেষ।"
    ];

    let state = "idle"; 
    let textIdx = 0;
    let textAlpha = 0;
    let fadeDir = 1;
    let textTimer = 0;
    
    // ক্যারেকটার পজিশন
    let boyX = -100;
    let girlX = 0;
    let groundY = 0;
    let meetX = 0;

    // স্টারস
    let stars = [];

    // --- সেটআপ ---
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        groundY = height - 100;
        meetX = width / 2;
        if(state === "idle") girlX = width + 100;
        
        stars = [];
        for(let i=0; i<150; i++) {
            stars.push({x: Math.random()*width, y: Math.random()*height/1.5, r: Math.random()*2, a: Math.random()});
        }
    }
    window.addEventListener('resize', resize);
    resize();

    // --- স্টার্ট ---
    function startStory() {
        document.getElementById('overlay').style.opacity = 0;
        setTimeout(() => document.getElementById('overlay').style.display = 'none', 1000);
        
        const sultan = document.getElementById('sultan');
        sultan.volume = 1.0;
        sultan.play().catch(e => console.log("Audio file missing"));
        
        state = "letter";
        animate();
    }

    // --- টেক্সট র‍্যাপিং ফাংশন (নতুন যোগ করা হয়েছে) ---
    function wrapText(context, text, x, y, maxWidth, lineHeight) {
        let words = text.split(' ');
        let line = '';
        let lines = [];

        for(let n = 0; n < words.length; n++) {
            let testLine = line + words[n] + ' ';
            let metrics = context.measureText(testLine);
            let testWidth = metrics.width;
            if (testWidth > maxWidth && n > 0) {
                lines.push(line);
                line = words[n] + ' ';
            } else {
                line = testLine;
            }
        }
        lines.push(line);
        return lines;
    }

    // --- ড্রয়িং ---
    function drawScene() {
        // আকাশ
        let grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, "#020024");
        grad.addColorStop(1, "#090979");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // তারা
        ctx.fillStyle = "white";
        stars.forEach(s => {
            ctx.globalAlpha = Math.abs(Math.sin(Date.now() * 0.002 + s.x));
            ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        // চাঁদ
        ctx.shadowBlur = 50; ctx.shadowColor = "white";
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(100, 100, 40, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;

        // মাটি
        ctx.fillStyle = "#000"; 
        ctx.beginPath();
        ctx.moveTo(0, height);
        ctx.lineTo(0, groundY + 20);
        ctx.quadraticCurveTo(width/2, groundY - 20, width, groundY + 20);
        ctx.lineTo(width, height);
        ctx.fill();
    }

    // সুজন (Silhouette)
    function drawBoy(x, y, isHugging) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = "#000";

        let lean = isHugging ? 5 : 0;
        // শরীর
        ctx.beginPath();
        ctx.moveTo(-15, -130); 
        ctx.quadraticCurveTo(20 + lean, -130, 25 + lean, -50); 
        ctx.lineTo(-20 + lean, -50); 
        ctx.lineTo(-25, -130);
        ctx.fill();
        // পা
        ctx.fillRect(-18, -50, 14, 60); 
        ctx.fillRect(2, -50, 14, 60);
        // মাথা
        ctx.beginPath(); ctx.arc(0 + lean, -145, 18, 0, Math.PI*2); ctx.fill();
        // হাত
        ctx.strokeStyle = "#000"; ctx.lineWidth = 8; ctx.lineCap = "round";
        ctx.beginPath();
        if(isHugging) {
            ctx.moveTo(-10, -125); ctx.quadraticCurveTo(30, -120, 55, -100); ctx.stroke();
        } else {
            ctx.moveTo(-10, -125); ctx.lineTo(-15, -80); ctx.stroke();
        }
        ctx.restore();
    }

    // নুসরাত (Silhouette + Back Hair)
    function drawGirl(x, y, isHugging) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = "#000";

        let lean = isHugging ? -5 : 0;
        // শরীর
        ctx.beginPath();
        ctx.moveTo(-12, -120); 
        ctx.quadraticCurveTo(15, -120, 15, -120); 
        ctx.lineTo(25 + lean, 0); 
        ctx.lineTo(-25 + lean, 0); 
        ctx.fill();
        // মাথা
        ctx.beginPath(); ctx.arc(0 + lean, -135, 16, 0, Math.PI*2); ctx.fill();

        // কোকড়ানো চুল (পেছনে)
        ctx.beginPath();
        let hairX = -10 + lean; 
        for(let i=0; i<6; i++) {
            ctx.arc(hairX, -135 + (i*8), 10, 0, Math.PI*2); 
            ctx.arc(hairX - 5, -135 + (i*8), 8, 0, Math.PI*2);
        }
        ctx.fill();

        // হাত
        ctx.strokeStyle = "#000"; ctx.lineWidth = 6; ctx.lineCap = "round";
        ctx.beginPath();
        if(isHugging) {
            ctx.moveTo(5, -120); ctx.quadraticCurveTo(-20, -115, -45, -100); ctx.stroke();
        } else {
            ctx.moveTo(5, -120); ctx.lineTo(10, -80); ctx.stroke();
        }
        ctx.restore();
    }

    // স্মার্ট ডায়ালগ বাবল (ফিক্সড)
    function drawBubble(text, x, y, alignLeft) {
        // ফন্ট সাইজ রেসপন্সিভ করা
        let fontSize = Math.min(20, width / 25);
        ctx.font = fontSize + "px 'Hind Siliguri'";
        
        let maxWidth = Math.min(250, width * 0.8); // স্ক্রিনের ৮০% এর বেশি চওড়া হবে না
        let lineHeight = fontSize + 10;
        
        // টেক্সট র‍্যাপ করা
        let lines = wrapText(ctx, text, 0, 0, maxWidth, lineHeight);
        
        let w = maxWidth; // বক্সের উইডথ ফিক্সড বা কন্টেন্ট অনুযায়ী হতে পারে, এখানে সহজ করার জন্য ম্যাক্স রাখলাম
        // আসলে বক্সের উইডথ মাপা উচিত সব লাইনের মধ্যে সবচেয়ে বড়টা
        let maxLineWidth = 0;
        lines.forEach(l => {
            let mw = ctx.measureText(l).width;
            if(mw > maxLineWidth) maxLineWidth = mw;
        });
        w = maxLineWidth + 30;

        let h = (lines.length * lineHeight) + 20;
        
        // পজিশন ক্যালকুলেশন (যাতে বাইরে না যায়)
        let bx = alignLeft ? x - w - 20 : x + 20;
        let by = y - 220;

        // স্ক্রিনের বাইরে গেলে পজিশন ঠিক করা
        if (bx < 10) bx = 10;
        if (bx + w > width - 10) bx = width - w - 10;

        // বাবল আঁকা
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.beginPath();
        ctx.roundRect(bx, by, w, h, 10);
        ctx.fill();
        
        // লেজ (Bubble Tail) - এটা একটু ট্রিকি যখন পজিশন শিফট হয়, তাই সিম্পল রাখলাম
        ctx.beginPath();
        if (alignLeft) {
             // লেজটা ক্যারেকটারের দিকে পয়েন্ট করবে
             ctx.moveTo(bx + w - 10, by + h); 
             ctx.lineTo(x - 10, y - 150); // ক্যারেকটারের মাথার কাছে
             ctx.lineTo(bx + w - 30, by + h);
        } else {
             ctx.moveTo(bx + 10, by + h); 
             ctx.lineTo(x + 10, y - 150); 
             ctx.lineTo(bx + 30, by + h);
        }
        ctx.fill();

        // লেখা বসানো
        ctx.fillStyle = "#000";
        ctx.textAlign = "center";
        let textY = by + lineHeight;
        
        lines.forEach(line => {
            ctx.fillText(line, bx + w/2, textY - 5);
            textY += lineHeight;
        });
    }

    // --- মেইন লুপ ---
    function animate() {
        ctx.clearRect(0, 0, width, height);
        drawScene();

        // Phase 1: Letter
        if(state === "letter") {
            drawBoy(width/2 - (width < 500 ? 100 : 250), groundY, false);
            drawGirl(width/2 + (width < 500 ? 100 : 250), groundY, false);

            ctx.fillStyle = `rgba(255, 255, 255, ${textAlpha})`;
            // ফন্ট সাইজ রেসপন্সিভ
            ctx.font = Math.min(30, width/20) + "px 'Hind Siliguri'";
            ctx.textAlign = "center";
            ctx.shadowColor = "#ff4081"; ctx.shadowBlur = 10;
            
            // চিঠির লেখা র‍্যাপ করা
            let maxWidth = width * 0.9;
            let lines = wrapText(ctx, letters[textIdx], 0, 0, maxWidth, 40);
            
            let startY = height/3;
            lines.forEach((line, i) => {
                ctx.fillText(line, width/2, startY + (i * 40));
            });

            ctx.shadowBlur = 0;

            if(fadeDir === 1) {
                textAlpha += 0.005;
                if(textAlpha >= 1) { fadeDir = 0; setTimeout(() => fadeDir = -1, 3000); }
            } else if(fadeDir === -1) {
                textAlpha -= 0.01;
                if(textAlpha <= 0) {
                    textIdx++;
                    if(textIdx >= letters.length) state = "walking";
                    else fadeDir = 1;
                }
            }
        }

        // Phase 2: Walking
        else if(state === "walking") {
            if(boyX < meetX - 30) boyX += 1.5;
            if(girlX > meetX + 30) girlX -= 1.5;
            
            drawBoy(boyX, groundY, false);
            drawGirl(girlX, groundY, false);

            if(Math.abs(boyX - (meetX - 30)) < 2 && Math.abs(girlX - (meetX + 30)) < 2) {
                state = "hugging";
                changeMusic();
            }
        }

        // Phase 3: Hugging & Talking
        else if(state === "hugging") {
            drawBoy(meetX - 15, groundY, true);
            drawGirl(meetX + 15, groundY, true);

            textTimer++;

            if(textTimer > 50 && textTimer < 350) {
                drawBubble("আমি তোমাকে ভালোবাসি নুসরাত। তুমি আমার সব। ❤️", meetX, groundY, true);
            }
            else if(textTimer > 350) {
                drawBubble("আমিও আপনাকে ভালোবাসি। 💑", meetX, groundY, false);
                if(Math.random() < 0.2) createHeart();
                updateHearts();
            }
        }

        requestAnimationFrame(animate);
    }

    function changeMusic() {
        const s = document.getElementById('sultan');
        const t = document.getElementById('tujhe');

        let fadeOut = setInterval(() => {
            if(s.volume > 0.1) s.volume -= 0.1;
            else {
                clearInterval(fadeOut);
                s.pause();
                t.volume = 0;
                t.play().catch(e => console.log("Tujhe missing"));
                let fadeIn = setInterval(() => {
                    if(t.volume < 0.9) t.volume += 0.1;
                    else clearInterval(fadeIn);
                }, 200);
            }
        }, 200);
    }

    let hearts = [];
    function createHeart() {
        hearts.push({x: Math.random()*width, y: height, s: Math.random()*20+10, sp: Math.random()*2+1, a: 1});
    }
    function updateHearts() {
        hearts.forEach((h, i) => {
            ctx.globalAlpha = h.a;
            ctx.fillStyle = "#ff4081";
            ctx.font = h.s + "px Arial";
            ctx.fillText("❤️", h.x, h.y);
            h.y -= h.sp; h.a -= 0.01;
            if(h.a <= 0) hearts.splice(i, 1);
        });
        ctx.globalAlpha = 1;
    }

</script>
</body>
</html>
