<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sujon & Nusrat Love Story</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Hind Siliguri', sans-serif; user-select: none; }
        canvas { display: block; }

        /* স্টার্ট স্ক্রিন */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #141e30, #243b55);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; cursor: pointer; transition: opacity 0.8s;
        }
        .title { 
            font-size: 40px; font-family: 'Dancing Script', cursive; color: #ff4081; 
            margin-bottom: 20px; text-shadow: 0 0 15px rgba(255, 64, 129, 0.7); 
        }
        .btn-start {
            font-size: 20px; color: white; background: rgba(255,255,255,0.1);
            padding: 12px 35px; border-radius: 50px; border: 2px solid #ff4081;
            animation: pulse 1.5s infinite; font-weight: bold;
        }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 64, 129, 0.7); } 70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(255, 64, 129, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 64, 129, 0); } }
    </style>
</head>
<body>

<audio id="sultan" src="sultan.mp3" preload="auto"></audio>
<audio id="tujhe" src="tujhe.mp3" preload="auto"></audio>

<div id="overlay" onclick="startStory()">
    <div class="title">Sujon ❤️ Nusrat</div>
    <div class="btn-start">গল্প শুরু করতে ক্লিক করুন 🎵</div>
</div>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    // --- ২১ সেকেন্ডের জন্য ৫টি লাইন ---
    const letters = [
        "হে আমার প্রিয়তমা, আমার প্রেয়সী সুলতানা, আমার সম্রাজ্ঞী হুররাম...",
        "অহর্নিশি যার বিরহে আমি কাতর...",
        "আমার সব আনন্দের উৎস, আমার কষ্টের একমাত্র নিরাময় হুররাম।",
        "চাঁদনী রাতে তোমার চুলের মধুর গন্ধ মনে পড়ে যায়...",
        "বারবার তোমাকে দেখার তৃষ্ণা আমাকে ব্যাকুল করে তোলে..."
    ];

    let state = "idle";
    let textIdx = 0;
    let textAlpha = 0;
    let fadeDir = 1;
    let textTimer = 0;
    
    // ক্যারেকটার পজিশন
    let boyX = -150;
    let girlX = 0;
    let groundY = 0;
    let meetX = 0;

    // স্টারস
    let stars = [];

    // --- রিসাইজ ---
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        groundY = height - 100;
        meetX = width / 2;
        if(state === "idle") girlX = width + 150;
        
        stars = [];
        for(let i=0; i<150; i++) {
            stars.push({x: Math.random()*width, y: Math.random()*height/1.5, r: Math.random()*2, a: Math.random()});
        }
    }
    window.addEventListener('resize', resize);
    resize();

    // --- স্টার্ট ---
    function startStory() {
        const sultan = document.getElementById('sultan');
        sultan.volume = 1.0;
        
        sultan.play().then(() => {
            document.getElementById('overlay').style.opacity = 0;
            setTimeout(() => document.getElementById('overlay').style.display = 'none', 800);
            state = "letter";
            animate();
        }).catch(error => {
            alert("গান বাজছে না! আপনার ফোল্ডারে 'sultan.mp3' ফাইলটি আছে কি না দেখুন।");
        });
    }

    // --- টেক্সট র‍্যাপিং ---
    function wrapText(context, text, maxWidth) {
        let words = text.split(' ');
        let lines = [];
        let line = '';
        for(let n = 0; n < words.length; n++) {
            let testLine = line + words[n] + ' ';
            let metrics = context.measureText(testLine);
            if (metrics.width > maxWidth && n > 0) {
                lines.push(line);
                line = words[n] + ' ';
            } else {
                line = testLine;
            }
        }
        lines.push(line);
        return lines;
    }

    // --- ড্রয়িং ---
    function drawScene() {
        // আকাশ
        let grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, "#020024");
        grad.addColorStop(1, "#090979");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // তারা
        ctx.fillStyle = "white";
        stars.forEach(s => {
            ctx.globalAlpha = Math.abs(Math.sin(Date.now() * 0.002 + s.x));
            ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        // চাঁদ
        ctx.shadowBlur = 50; ctx.shadowColor = "white";
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(100, 100, 40, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;

        // মাটি
        ctx.fillStyle = "#000"; 
        ctx.beginPath();
        ctx.moveTo(0, height);
        ctx.lineTo(0, groundY + 20);
        ctx.quadraticCurveTo(width/2, groundY - 20, width, groundY + 20);
        ctx.lineTo(width, height);
        ctx.fill();
    }

    // সুজন
    function drawBoy(x, y, isHugging) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = "#000";
        let lean = isHugging ? 10 : 0; 
        ctx.beginPath();
        ctx.moveTo(-15, -130); 
        ctx.quadraticCurveTo(20 + lean, -130, 25 + lean, -50); 
        ctx.lineTo(-20 + lean, -50); 
        ctx.lineTo(-25, -130);
        ctx.fill();
        ctx.fillRect(-18, -50, 14, 60); 
        ctx.fillRect(2, -50, 14, 60); 
        ctx.beginPath(); ctx.arc(0 + lean, -145, 18, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "#000"; ctx.lineWidth = 8; ctx.lineCap = "round";
        ctx.beginPath();
        if(isHugging) {
            ctx.moveTo(-10, -125); ctx.quadraticCurveTo(30, -120, 55, -100); ctx.stroke();
        } else {
            ctx.moveTo(-10, -125); ctx.lineTo(-15, -80); ctx.stroke();
        }
        ctx.restore();
    }

    // নুসরাত
    function drawGirl(x, y, isHugging) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = "#000";
        let lean = isHugging ? -10 : 0;
        ctx.beginPath();
        ctx.moveTo(-12, -120); 
        ctx.quadraticCurveTo(15, -120, 15, -120); 
        ctx.lineTo(25 + lean, 0); 
        ctx.lineTo(-25 + lean, 0); 
        ctx.fill();
        ctx.beginPath(); ctx.arc(0 + lean, -135, 16, 0, Math.PI*2); ctx.fill();
        ctx.beginPath();
        let hairX = -10 + lean; 
        for(let i=0; i<6; i++) {
            ctx.arc(hairX, -135 + (i*8), 10, 0, Math.PI*2); 
            ctx.arc(hairX - 5, -135 + (i*8), 8, 0, Math.PI*2);
        }
        ctx.fill();
        ctx.strokeStyle = "#000"; ctx.lineWidth = 6; ctx.lineCap = "round";
        ctx.beginPath();
        if(isHugging) {
            ctx.moveTo(5, -120); ctx.quadraticCurveTo(-20, -115, -45, -100); ctx.stroke();
        } else {
            ctx.moveTo(5, -120); ctx.lineTo(10, -80); ctx.stroke();
        }
        ctx.restore();
    }

    // ডায়ালগ বাবল
    function drawBubble(text, x, y, alignLeft) {
        let fontSize = Math.min(18, width / 28);
        ctx.font = fontSize + "px 'Hind Siliguri'";
        let maxWidth = Math.min(250, width * 0.8);
        let lines = wrapText(ctx, text, maxWidth);
        let maxW = 0;
        lines.forEach(l => {
            let mw = ctx.measureText(l).width;
            if(mw > maxW) maxW = mw;
        });
        let w = maxW + 30;
        let lineHeight = fontSize + 10;
        let h = (lines.length * lineHeight) + 20;
        let bx = alignLeft ? x - w - 20 : x + 20;
        let by = y - 220;

        if (bx < 10) bx = 10;
        if (bx + w > width - 10) bx = width - w - 10;

        ctx.fillStyle = "rgba(255,255,255,0.95)";
        ctx.beginPath(); ctx.roundRect(bx, by, w, h, 10); ctx.fill();
        ctx.beginPath();
        if (alignLeft) {
             ctx.moveTo(bx + w - 10, by + h); ctx.lineTo(x - 10, y - 150); ctx.lineTo(bx + w - 30, by + h);
        } else {
             ctx.moveTo(bx + 10, by + h); ctx.lineTo(x + 10, y - 150); ctx.lineTo(bx + 30, by + h);
        }
        ctx.fill();

        ctx.fillStyle = "#000";
        ctx.textAlign = "center";
        let textY = by + lineHeight;
        lines.forEach(line => {
            ctx.fillText(line, bx + w/2, textY - 5);
            textY += lineHeight;
        });
    }

    // --- এনিমেশন লুপ ---
    function animate() {
        ctx.clearRect(0, 0, width, height);
        drawScene();

        // ১. চিঠি পড়া (২১ সেকেন্ড টাইমিং)
        if(state === "letter") {
            drawBoy(width/2 - (width < 500 ? 100 : 250), groundY, false);
            drawGirl(width/2 + (width < 500 ? 100 : 250), groundY, false);

            ctx.fillStyle = `rgba(255, 255, 255, ${textAlpha})`;
            ctx.font = Math.min(28, width/20) + "px 'Hind Siliguri'";
            ctx.textAlign = "center";
            ctx.shadowColor = "#ff4081"; ctx.shadowBlur = 10;
            
            let maxWidth = width * 0.9;
            let lines = wrapText(ctx, letters[textIdx], maxWidth);
            let startY = height/3;
            lines.forEach((line, i) => {
                ctx.fillText(line, width/2, startY + (i * 40));
            });
            ctx.shadowBlur = 0;

            // টেক্সট টাইমিং ক্যালকুলেশন (২১ সেকেন্ড / ৫ লাইন = ৪.২ সে/লাইন)
            if(fadeDir === 1) {
                textAlpha += 0.015; // ফাস্ট ফেড ইন (১ সেকেন্ডে)
                if(textAlpha >= 1) { fadeDir = 0; setTimeout(() => fadeDir = -1, 2500); } // ২.৫ সেকেন্ড হোল্ড
            } else if(fadeDir === -1) {
                textAlpha -= 0.03; // কুইক ফেড আউট (০.৭ সেকেন্ডে)
                if(textAlpha <= 0) {
                    textIdx++;
                    if(textIdx >= letters.length) state = "walking"; // লেখা শেষ হলে দৌড়
                    else fadeDir = 1;
                }
            }
        }

        // ২. দৌড়ে কাছে আসা (Running)
        else if(state === "walking") {
            if(boyX < meetX - 25) boyX += 5; // দৌড়ানোর গতি
            if(girlX > meetX + 25) girlX -= 5;
            
            drawBoy(boyX, groundY, false);
            drawGirl(girlX, groundY, false);

            if(Math.abs(boyX - (meetX - 25)) < 6 && Math.abs(girlX - (meetX + 25)) < 6) {
                state = "hugging";
                changeMusic(); // গান চেঞ্জ হবে
            }
        }

        // ৩. জড়িয়ে ধরা ও শেষ ডায়ালগ
        else if(state === "hugging") {
            drawBoy(meetX - 15, groundY, true);
            drawGirl(meetX + 15, groundY, true);

            textTimer++;

            // সুজনের শেষ ডায়ালগ
            if(textTimer > 50 && textTimer < 350) {
                drawBubble("আমি তোমাকে ভালোবাসি নুসরাত, তুমি আমার সব। ❤️", meetX, groundY, true);
            }
            // নুসরাতের উত্তর
            else if(textTimer > 350) {
                drawBubble("আমিও আপনাকে ভালোবাসি। 💑", meetX, groundY, false);
                if(Math.random() < 0.3) createHeart();
                updateHearts();
            }
        }

        requestAnimationFrame(animate);
    }

    // --- মিউজিক পরিবর্তন ---
    function changeMusic() {
        const s = document.getElementById('sultan');
        const t = document.getElementById('tujhe');

        let fadeOut = setInterval(() => {
            if(s.volume > 0.1) s.volume -= 0.1;
            else {
                clearInterval(fadeOut);
                s.pause();
                
                t.volume = 0;
                t.play().then(() => {
                    let fadeIn = setInterval(() => {
                        if(t.volume < 0.9) t.volume += 0.1;
                        else clearInterval(fadeIn);
                    }, 200);
                }).catch(e => console.log("Tujhe mp3 missing"));
            }
        }, 100); 
    }

    let hearts = [];
    function createHeart() {
        hearts.push({x: Math.random()*width, y: height, s: Math.random()*20+10, sp: Math.random()*2+1, a: 1});
    }
    function updateHearts() {
        hearts.forEach((h, i) => {
            ctx.globalAlpha = h.a;
            ctx.fillStyle = "#ff4081";
            ctx.font = h.s + "px Arial";
            ctx.fillText("❤️", h.x, h.y);
            h.y -= h.sp; h.a -= 0.01;
            if(h.a <= 0) hearts.splice(i, 1);
        });
        ctx.globalAlpha = 1;
    }

</script>
</body>
</html>
